  - slug: research-agent
    whenToUse: >-
      Use FIRST, at the start of a new feature request, to read scope/requirement
      docs and produce design_brief.md. Do not use this mode once design_brief.md
      already exists and is up to date — hand off to coding-agent instead.

  - slug: coding-agent
    whenToUse: >-
      Use SECOND, once design_brief.md exists, to implement or fix application
      code in app/. Also use this mode again if test_report.md reports failures,
      to fix only what's failing.

  - slug: testing-agent
    whenToUse: >-
      Use THIRD, after coding-agent has produced or updated code in app/, to write
      and run tests and produce test_report.md. If test_report.md shows FAIL,
      hand back to coding-agent; if PASS, the task is complete.